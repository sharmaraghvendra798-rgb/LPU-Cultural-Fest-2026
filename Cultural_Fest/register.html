<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cultural Fest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; }
        header { background-color: #1e293b; color: white; padding: 20px; text-align: center; }
        nav { background-color: #0f172a; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 12px; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 16px; border-radius: 5px; }
        nav a:hover, nav a.active { background-color: #38bdf8; color: #0f172a; }
        
        main { width: 60%; margin: 30px auto; background-color: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        fieldset { border: 2px solid #2563eb; padding: 20px; border-radius: 8px; }
        legend { padding: 0 10px; font-weight: bold; color: #2563eb; font-size: 20px; }
        
        label { font-weight: bold; display: block; margin-top: 15px; }
        input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;
        }
        
        .btn-submit { background-color: #16a34a; color: white; padding: 12px; border: none; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; width: 48%; }
        .btn-reset { background-color: #dc2626; color: white; padding: 12px; border: none; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; width: 48%; }
        
        footer { background-color: #1e293b; color: white; text-align: center; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>Official Team Registration Form</h1>
        <p>Register your team to generate entry pass</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="dance.html">Dance</a>
        <a href="music.html">Music</a>
        <a href="dramatics.html">Dramatics</a>
        <a href="literary.html">Literary</a>
        <a href="finearts.html">Fine Arts</a>
        <a href="gaming.html">Gaming</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html" class="active">Register Now</a>
    </nav>

    <main>
        <form action="#" method="get">
            <fieldset>
                <legend>Team & Captain Details</legend>

                <label for="cname">Team Captain Name:</label>
                <input type="text" id="cname" placeholder="Enter full name" required>

                <label for="roll">Captain Roll Number:</label>
                <input type="number" id="roll" placeholder="Enter roll number" required>

                <label for="email">College Email Address:</label>
                <input type="email" id="email" placeholder="student@lpu.in" required>

                <label for="event">Select Participating Event:</label>
                <select id="event" required>
                    <option value="">-- Choose Competition --</option>
                    <option value="solo_dance">Solo Dance Challenge</option>
                    <option value="group_dance">Group Street Dance</option>
                    <option value="band">Battle of Bands</option>
                    <option value="vocal">Solo Vocal Symphony</option>
                    <option value="nukkad">Nukkad Natak</option>
                    <option value="debate">Debate Championship</option>
                    <option value="finearts">Face Painting</option>
                    <option value="coding">Coding Hackathon</option>
                </select>

                <label for="members">Team Member Roll Numbers (Comma Separated):</label>
                <textarea id="members" rows="3" placeholder="e.g. 1220101, 1220102, 1220103"></textarea>

                <label for="idcard">Upload Student ID Proof:</label>
                <input type="file" id="idcard" style="margin-top: 5px;">

                <label for="date">Date of Spot Registration:</label>
                <input type="date" id="date">

                <div style="display: flex; justify-content: space-between;">
                    <input type="submit" value="Submit Registration" class="btn-submit">
                    <input type="reset" value="Reset Form" class="btn-reset">
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Cultural Fest Registration Desk</p>
    </footer>

</body>
</html>
